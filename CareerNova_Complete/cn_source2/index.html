<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerNova – Find Work That Moves Your Career Forward</title>
    <meta name="description" content="India's most advanced AI-powered job platform. Discover thousands of opportunities, connect with leading companies." />
    <style>
      /* Prevent white flash before React/JS loads */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root {
        min-height: 100vh;
        background: #F8FAFC;
        font-family: Inter, -apple-system, sans-serif;
      }
      /* Show a centered loader before React takes over */
      #root:empty::after {
        content: "";
        position: fixed;
        inset: 0;
        display: flex;
        background: #F8FAFC;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
